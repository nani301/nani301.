<svg viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg" width="900" height="140">
  <defs>
    <linearGradient id="footerTopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="50%" stop-color="rgba(88,166,255,0.25)"/>
      <stop offset="75%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="footerGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="140" fill="#050505"/>
  <rect width="900" height="140" fill="url(#footerGlow)"/>

  <!-- Top border -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="url(#footerTopLine)" stroke-width="0.8"/>

  <!-- NANI.OS logotype -->
  <text x="450" y="52" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle" letter-spacing="8" opacity="0.5">NANI.OS</text>

  <!-- Tagline -->
  <text x="450" y="78" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" letter-spacing="0.5" opacity="0.7">Building software that thinks.</text>

  <!-- Contact links - minimal row -->
  <text x="338" y="106" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" text-anchor="middle" letter-spacing="0.5">Email</text>
  <text x="390" y="106" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#8b949e" text-anchor="middle" opacity="0.3">·</text>
  <text x="450" y="106" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" text-anchor="middle" letter-spacing="0.5">Twitter</text>
  <text x="510" y="106" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#8b949e" text-anchor="middle" opacity="0.3">·</text>
  <text x="562" y="106" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" text-anchor="middle" letter-spacing="0.5">LinkedIn</text>

  <!-- Bottom line -->
  <line x1="0" y1="130" x2="900" y2="130" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="450" y="139" font-family="'SF Mono','Fira Code',monospace" font-size="7" fill="#8b949e" text-anchor="middle" opacity="0.3" letter-spacing="1">nani301 · Hyderabad · 2026</text>

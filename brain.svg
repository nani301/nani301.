<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" width="900" height="220">
  <defs>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e13"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="220" fill="#050505"/>

  <!-- Terminal window -->
  <rect x="80" y="20" width="740" height="182" rx="0" fill="url(#terminalBg)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Terminal header bar -->
  <rect x="80" y="20" width="740" height="32" rx="0" fill="rgba(255,255,255,0.03)" stroke="none"/>
  <line x1="80" y1="52" x2="820" y2="52" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Terminal dots -->
  <circle cx="104" cy="36" r="5" fill="#ff5f57" opacity="0.8"/>
  <circle cx="122" cy="36" r="5" fill="#febc2e" opacity="0.8"/>
  <circle cx="140" cy="36" r="5" fill="#28c840" opacity="0.8"/>

  <!-- Terminal title -->
  <text x="450" y="41" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#8b949e" text-anchor="middle" opacity="0.6">nani@NANI.OS — mission.sh</text>

  <!-- Terminal content -->
  <text x="108" y="78" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#58a6ff" opacity="0.8">$</text>
  <text x="124" y="78" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#8b949e">cat current_mission.yml</text>

  <text x="108" y="100" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#8b949e" opacity="0.5">mission:</text>
  <text x="124" y="116" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#58a6ff">  build: Mira AI, AI Workspace, Agentic Systems</text>
  <text x="124" y="132" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#3fb950">  learn: Computer Vision, RAG, Automation</text>
  <text x="124" y="148" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#a371f7">  ship:  Production-ready AI products</text>

  <text x="108" y="168" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#8b949e" opacity="0.5">dream:</text>
  <text x="124" y="184" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#f78166">&gt;  Build software where AI replaces repetitive work.</text>

  <!-- Cursor blink -->
  <rect x="108" y="196" width="8" height="12" fill="#58a6ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>

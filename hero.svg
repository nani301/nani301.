<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" width="900" height="520">
  <defs>
    <!-- Noise texture filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Stronger glow for accent -->
    <filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Blur for ambient light -->
    <filter id="ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <!-- Radial gradients -->
    <radialGradient id="ambientLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="20%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="80%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Clip paths -->
    <clipPath id="mainClip">
      <rect width="900" height="520"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#050505"/>

  <!-- Ambient glow -->
  <ellipse cx="450" cy="200" rx="350" ry="200" fill="url(#ambientLight)"/>

  <!-- Grid lines - very subtle -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="260" x2="900" y2="260"/>
    <line x1="0" y1="390" x2="900" y2="390"/>
    <line x1="225" y1="0" x2="225" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="675" y1="0" x2="675" y2="520"/>
  </g>

  <!-- Neural network - left cluster -->
  <g clip-path="url(#mainClip)" opacity="0.35">
    <!-- Connection lines -->
    <line x1="60" y1="180" x2="130" y2="240" stroke="#58a6ff" stroke-width="0.6" opacity="0.3"/>
    <line x1="60" y1="180" x2="110" y2="130" stroke="#58a6ff" stroke-width="0.6" opacity="0.3"/>
    <line x1="110" y1="130" x2="200" y2="160" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="130" y1="240" x2="200" y2="210" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="200" y1="160" x2="200" y2="210" stroke="#58a6ff" stroke-width="0.6" opacity="0.15"/>
    <line x1="130" y1="240" x2="160" y2="310" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="60" y1="340" x2="130" y2="240" stroke="#58a6ff" stroke-width="0.6" opacity="0.25"/>
    <line x1="60" y1="340" x2="160" y2="310" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="30" y1="260" x2="60" y2="180" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="30" y1="260" x2="60" y2="340" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>

    <!-- Nodes with pulse animation -->
    <circle cx="60" cy="180" r="2.5" fill="#58a6ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="130" r="1.8" fill="#58a6ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="240" r="2" fill="#58a6ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="160" r="1.5" fill="#58a6ff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="210" r="2" fill="#58a6ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="310" r="1.8" fill="#58a6ff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="340" r="2.2" fill="#58a6ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="260" r="1.5" fill="#58a6ff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Signal pulse traveling along connection -->
    <circle cx="0" cy="0" r="1.5" fill="#58a6ff" opacity="0.9" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M60,180 L130,240 L200,210 L160,310"/>
    </circle>
  </g>

  <!-- Neural network - right cluster -->
  <g clip-path="url(#mainClip)" opacity="0.35">
    <line x1="840" y1="160" x2="770" y2="230" stroke="#58a6ff" stroke-width="0.6" opacity="0.3"/>
    <line x1="840" y1="160" x2="790" y2="110" stroke="#58a6ff" stroke-width="0.6" opacity="0.25"/>
    <line x1="790" y1="110" x2="700" y2="150" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="770" y1="230" x2="700" y2="200" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="700" y1="150" x2="700" y2="200" stroke="#58a6ff" stroke-width="0.6" opacity="0.15"/>
    <line x1="770" y1="230" x2="740" y2="320" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="840" y1="340" x2="770" y2="230" stroke="#58a6ff" stroke-width="0.6" opacity="0.25"/>
    <line x1="840" y1="340" x2="740" y2="320" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="870" y1="250" x2="840" y2="160" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>
    <line x1="870" y1="250" x2="840" y2="340" stroke="#58a6ff" stroke-width="0.6" opacity="0.2"/>

    <circle cx="840" cy="160" r="2.5" fill="#58a6ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="110" r="1.8" fill="#58a6ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="230" r="2" fill="#58a6ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="1.5" fill="#58a6ff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="200" r="2" fill="#58a6ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="320" r="1.8" fill="#58a6ff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="340" r="2.2" fill="#58a6ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="250" r="1.5" fill="#58a6ff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="0" cy="0" r="1.5" fill="#58a6ff" opacity="0.9" filter="url(#glow)">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M840,160 L770,230 L700,200 L740,320"/>
    </circle>
  </g>

  <!-- Floating particles -->
  <g clip-path="url(#mainClip)">
    <circle cx="320" cy="80" r="1" fill="#ffffff" opacity="0.15">
      <animate attributeName="cy" values="80;70;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.05;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="100" r="0.8" fill="#ffffff" opacity="0.12">
      <animate attributeName="cy" values="100;88;100" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.04;0.12" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="450" r="1" fill="#58a6ff" opacity="0.12">
      <animate attributeName="cy" values="450;440;450" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.04;0.12" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="420" r="0.8" fill="#ffffff" opacity="0.1">
      <animate attributeName="cy" values="420;410;420" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="400" r="1" fill="#58a6ff" opacity="0.1">
      <animate attributeName="cy" values="400;390;400" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="480" r="0.8" fill="#ffffff" opacity="0.08">
      <animate attributeName="cy" values="480;468;480" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="470" r="1.2" fill="#58a6ff" opacity="0.1">
      <animate attributeName="cy" values="470;460;470" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="30" r="0.7" fill="#ffffff" opacity="0.1">
      <animate attributeName="cy" values="30;20;30" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="490" r="1" fill="#ffffff" opacity="0.08">
      <animate attributeName="cy" values="490;478;490" dur="6.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="60" r="0.8" fill="#58a6ff" opacity="0.12">
      <animate attributeName="cy" values="60;50;60" dur="7.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Edge fade masks -->
  <rect width="200" height="520" fill="url(#fadeLeft)"/>
  <rect x="700" width="200" height="520" fill="url(#fadeRight)"/>

  <!-- Top border accent line -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Scan line animation -->
  <rect x="0" y="-40" width="900" height="80" fill="url(#scanGrad)" opacity="1">
    <animate attributeName="y" values="-40;560;-40" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- OS status bar -->
  <g opacity="0.4">
    <text x="32" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#8b949e" letter-spacing="2">NANI.OS</text>
    <circle cx="108" cy="24" r="2.5" fill="#3fb950"/>
    <text x="116" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#3fb950" letter-spacing="1">ONLINE</text>
    <text x="802" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#8b949e" letter-spacing="1" text-anchor="end">ECE × AI × FULLSTACK</text>
  </g>

  <!-- Horizontal rule -->
  <line x1="32" y1="38" x2="868" y2="38" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>

  <!-- Main headline: NANI -->
  <text
    x="450" y="210"
    font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="148"
    font-weight="700"
    letter-spacing="-6"
    fill="url(#textGrad)"
    text-anchor="middle"
    filter="url(#noise)"
    opacity="1"
  >NANI</text>

  <!-- Subtle glow behind text -->
  <text
    x="450" y="210"
    font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="148"
    font-weight="700"
    letter-spacing="-6"
    fill="#58a6ff"
    text-anchor="middle"
    filter="url(#ambient)"
    opacity="0.06"
  >NANI</text>

  <!-- Divider line between title and subtitle -->
  <line x1="380" y1="228" x2="520" y2="228" stroke="#58a6ff" stroke-width="0.5" opacity="0.4"/>

  <!-- Subtitle -->
  <text
    x="450" y="268"
    font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="15"
    font-weight="400"
    fill="#8b949e"
    text-anchor="middle"
    letter-spacing="4"
  >BUILDING AI PRODUCTS THAT THINK.</text>

  <!-- Animated accent dot in subtitle -->
  <circle cx="769" cy="264" r="2" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom meta row -->
  <g opacity="0.35">
    <text x="450" y="330" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8b949e" text-anchor="middle" letter-spacing="1">
      Hyderabad  ·  India  ·  ECE Engineer
    </text>
  </g>

  <!-- Bottom border accent -->
  <line x1="0" y1="520" x2="900" y2="520" stroke="url(#borderGrad)" stroke-width="0.5"/>

  <!-- Corner marks - ultra minimal -->
  <g stroke="#8b949e" stroke-width="0.8" opacity="0.2">
    <line x1="32" y1="48" x2="32" y2="60"/>
    <line x1="32" y1="48" x2="44" y2="48"/>
    <line x1="868" y1="48" x2="868" y2="60"/>
    <line x1="868" y1="48" x2="856" y2="48"/>
    <line x1="32" y1="510" x2="32" y2="498"/>
    <line x1="32" y1="510" x2="44" y2="510"/>
    <line x1="868" y1="510" x2="868" y2="498"/>
    <line x1="868" y1="510" x2="856" y2="510"/>
  </g>
</svg>

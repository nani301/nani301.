<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" width="900" height="580">
  <defs>
    <filter id="cardNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f78166" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f78166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#050505"/>

  <!-- Section label -->
  <text x="32" y="38" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#8b949e" letter-spacing="3" opacity="0.6">FEATURED PRODUCTS</text>
  <line x1="32" y1="48" x2="868" y2="48" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>

  <!-- ═══ CARD 1: Mira AI ═══ -->
  <rect x="32" y="68" width="404" height="224" rx="0" fill="url(#cardBg1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Top accent line -->
  <line x1="32" y1="68" x2="200" y2="68" stroke="url(#accentLine)" stroke-width="1.5"/>
  <!-- Status dot -->
  <circle cx="52" cy="90" r="3" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="94" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#3fb950" letter-spacing="1.5">LIVE</text>
  <!-- Project name -->
  <text x="32" y="128" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-size="26" font-weight="600" fill="#ffffff" dx="20">Mira AI</text>
  <!-- Description -->
  <text x="52" y="154" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#8b949e">AI-powered facial attendance platform</text>
  <!-- Tags -->
  <rect x="52" y="170" width="52" height="18" rx="2" fill="rgba(88,166,255,0.08)" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <text x="78" y="182" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#58a6ff" text-anchor="middle">Flutter</text>
  <rect x="112" y="170" width="66" height="18" rx="2" fill="rgba(88,166,255,0.08)" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <text x="145" y="182" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#58a6ff" text-anchor="middle">TypeScript</text>
  <rect x="186" y="170" width="36" height="18" rx="2" fill="rgba(88,166,255,0.08)" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <text x="204" y="182" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#58a6ff" text-anchor="middle">CV</text>
  <!-- Bottom links -->
  <line x1="32" y1="264" x2="436" y2="264" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="52" y="284" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" letter-spacing="0.5">↗ Live Demo</text>
  <text x="156" y="284" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#8b949e" letter-spacing="0.5">/ GitHub</text>

  <!-- ═══ CARD 2: Global North ═══ -->
  <rect x="464" y="68" width="404" height="224" rx="0" fill="url(#cardBg1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="464" y1="68" x2="632" y2="68" stroke="url(#accentLine2)" stroke-width="1.5"/>
  <circle cx="484" cy="90" r="3" fill="#f78166">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="496" y="94" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#f78166" letter-spacing="1.5">BUILDING</text>
  <text x="464" y="128" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-size="26" font-weight="600" fill="#ffffff" dx="20">Global North</text>
  <text x="484" y="154" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#8b949e">Overseas consultancy platform</text>
  <rect x="484" y="170" width="60" height="18" rx="2" fill="rgba(63,185,80,0.08)" stroke="rgba(63,185,80,0.2)" stroke-width="1"/>
  <text x="514" y="182" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#3fb950" text-anchor="middle">Next.js</text>
  <rect x="552" y="170" width="66" height="18" rx="2" fill="rgba(63,185,80,0.08)" stroke="rgba(63,185,80,0.2)" stroke-width="1"/>
  <text x="585" y="182" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#3fb950" text-anchor="middle">TypeScript</text>
  <rect x="626" y="170" width="40" height="18" rx="2" fill="rgba(63,185,80,0.08)" stroke="rgba(63,185,80,0.2)" stroke-width="1"/>
  <text x="646" y="182" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#3fb950" text-anchor="middle">AI</text>
  <line x1="464" y1="264" x2="868" y2="264" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="484" y="284" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" letter-spacing="0.5">↗ Live Demo</text>
  <text x="588" y="284" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#8b949e" letter-spacing="0.5">/ GitHub</text>

  <!-- ═══ CARD 3: AI Workspace ═══ (wide) -->
  <rect x="32" y="316" width="280" height="224" rx="0" fill="url(#cardBg1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="32" y1="316" x2="180" y2="316" stroke="url(#accentLine3)" stroke-width="1.5"/>
  <circle cx="52" cy="338" r="3" fill="#f78166">
    <animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="342" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#f78166" letter-spacing="1.5">BUILDING</text>
  <text x="32" y="376" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-size="22" font-weight="600" fill="#ffffff" dx="20">AI Workspace</text>
  <text x="52" y="400" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#8b949e">Personal AI OS</text>
  <rect x="52" y="416" width="52" height="18" rx="2" fill="rgba(163,113,247,0.08)" stroke="rgba(163,113,247,0.2)" stroke-width="1"/>
  <text x="78" y="428" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#a371f7" text-anchor="middle">React</text>
  <rect x="112" y="416" width="40" height="18" rx="2" fill="rgba(163,113,247,0.08)" stroke="rgba(163,113,247,0.2)" stroke-width="1"/>
  <text x="132" y="428" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#a371f7" text-anchor="middle">AI</text>
  <line x1="32" y1="512" x2="312" y2="512" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="52" y="532" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" letter-spacing="0.5">↗ Preview</text>

  <!-- ═══ CARD 4: Why Not We ═══ -->
  <rect x="340" y="316" width="240" height="224" rx="0" fill="url(#cardBg1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="340" y1="316" x2="460" y2="316" stroke="url(#accentLine4)" stroke-width="1.5"/>
  <circle cx="360" cy="338" r="3" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="372" y="342" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#3fb950" letter-spacing="1.5">LIVE</text>
  <text x="340" y="376" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-size="22" font-weight="600" fill="#ffffff" dx="20">Why Not We</text>
  <text x="360" y="400" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#8b949e">Community org</text>
  <rect x="360" y="416" width="66" height="18" rx="2" fill="rgba(247,129,102,0.08)" stroke="rgba(247,129,102,0.2)" stroke-width="1"/>
  <text x="393" y="428" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#f78166" text-anchor="middle">TypeScript</text>
  <line x1="340" y1="512" x2="580" y2="512" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="360" y="532" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" letter-spacing="0.5">↗ GitHub</text>

  <!-- ═══ CARD 5: Voice Agents ═══ -->
  <rect x="608" y="316" width="260" height="224" rx="0" fill="url(#cardBg1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="608" y1="316" x2="756" y2="316" stroke="url(#accentLine5)" stroke-width="1.5"/>
  <circle cx="628" cy="338" r="3" fill="#f78166">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="640" y="342" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#f78166" letter-spacing="1.5">BUILDING</text>
  <text x="608" y="376" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-size="22" font-weight="600" fill="#ffffff" dx="20">Voice Agents</text>
  <text x="628" y="400" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#8b949e">Agentic voice systems</text>
  <rect x="628" y="416" width="60" height="18" rx="2" fill="rgba(88,166,255,0.08)" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <text x="658" y="428" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#58a6ff" text-anchor="middle">Python</text>
  <rect x="696" y="416" width="42" height="18" rx="2" fill="rgba(88,166,255,0.08)" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <text x="717" y="428" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#58a6ff" text-anchor="middle">LLM</text>
  <line x1="608" y1="512" x2="868" y2="512" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="628" y="532" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" letter-spacing="0.5">↗ Preview</text>

  <!-- Bottom border -->
  <line x1="0" y1="579" x2="900" y2="579" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
</svg>
